name: CI

on:
  push:
  pull_request:

# Least-privilege default token: the check job only reads the repo (checkout + tests).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # cfg.py validates a batch of env vars at import time (it is imported by the
    # test suite). The DB layer itself runs on temp-file SQLite, so these are
    # dummy placeholders only — no real services are contacted.
    env:
      DATABASE_SSL: "false"
      DATABASE_URL: "postgresql://user:pass@localhost/dd"
      SHEETS_PROJECT_ID: "ci"
      SHEETS_PRIVATE_KEY_ID: "ci"
      SHEETS_PRIVATE_KEY: "ci"
      SHEETS_CLIENT_EMAIL: "ci@example.com"
      SHEETS_CLIENT_ID: "ci"
      SHEETS_CLIENT_X509_CERT_URL: "https://example.com/cert"
      SHEETS_LS_URL: "https://example.com/ls"
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version, unlike the actions/* pins above: setup-uv stopped
      # publishing floating major tags at v8 on purpose, so @v9 does not resolve.
      # Bumping it means editing this literal.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      # conftest.py is passed alongside `dd`: it is the one Python file outside the
      # package tree (repo-root, holding the session DB fixture and its non-local-DB
      # wipe guard), so a bare `dd` path would leave it unlinted and untyped.
      - name: Lint (ruff)
        run: uv run ruff check dd conftest.py

      - name: Type check (ty)
        run: uv run ty check dd conftest.py

      # Playwright ships as a dev dep but the browser binary is a separate ~150MB
      # download. Without it the CV2 builder's drag tests SKIP rather than fail, so these
      # steps are what make them real — that layer has no other automated coverage
      # (plans/web_cv2_builder_followups.md §6). Cached on the resolved playwright
      # version so the download is paid once per upgrade rather than on every push,
      # including the many that touch no web code.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium (Playwright)
        run: uv run playwright install --with-deps chromium

      - name: Test (pytest, SQLite)
        # Mirror `make coverage`: skip the live-Discord tests (they need a real
        # bot token + guild and are opt-in via `make test-integration`).
        run: uv run python -m pytest -m "not discord" --cov=dd --cov-report=term-missing

  js:
    # web_static JS unit tests (node --test). The CV2 builder's node model is a client
    # mirror of dd/anchor/cv2_nodes.py and the builder UI renders straight out of it, so
    # it is worth testing directly rather than only through the Python side. No bundler,
    # no browser, no dependencies — hence its own tiny lane rather than a step in `check`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test (node --test)
        run: make test-js

  postgres:
    # Real-Postgres dialect lane. The `check` job runs the DB tests on SQLite, which is
    # a different dialect from what production runs, so this pins the paths that differ:
    # the ON CONFLICT upsert branches (`_dialect_insert` picks the postgresql construct
    # here and the sqlite one there), TIMESTAMP/DATE round-tripping, and psycopg's
    # executemany. It re-runs the DB-`integration` tests against a Postgres 17 service;
    # the live-Discord tests are still skipped (no bot token/guild in CI).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dd
          POSTGRES_PASSWORD: dd
          POSTGRES_DB: dd
          # initdb takes the server's `timezone` from the container's TZ, so this pins
          # the lane to a deliberately NON-UTC server. The app stores naive-UTC
          # timestamps but binds some of them as tz-aware, which Postgres converts using
          # the session TimeZone — a UTC-only lane could never catch cfg dropping its
          # `-c timezone=UTC` (test_enqueue_stores_timestamps_as_utc_wall_clock).
          TZ: America/New_York
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dd -d dd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # The service has no TLS, so don't let cfg append sslmode=require.
      DATABASE_SSL: "false"
      # 127.0.0.1 is in schemas._db_is_local()'s allowlist, so TEST_USE_POSTGRES
      # exercises the real engine (the fixtures create/drop the schema) WITHOUT needing
      # the ALLOW_REMOTE_SCHEMA_DESTROY override — this is a throwaway CI database.
      DATABASE_URL: "postgresql://dd:dd@127.0.0.1:5432/dd"
      TEST_USE_POSTGRES: "1"
      SHEETS_PROJECT_ID: "ci"
      SHEETS_PRIVATE_KEY_ID: "ci"
      SHEETS_PRIVATE_KEY: "ci"
      SHEETS_CLIENT_EMAIL: "ci@example.com"
      SHEETS_CLIENT_ID: "ci"
      SHEETS_CLIENT_X509_CERT_URL: "https://example.com/cert"
      SHEETS_LS_URL: "https://example.com/ls"
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version, unlike the actions/* pins above: setup-uv stopped
      # publishing floating major tags at v8 on purpose, so @v9 does not resolve.
      # Bumping it means editing this literal.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Test (pytest, Postgres — DB integration only)
        # `wait_for_db()` in the test fixture handles any residual connect delay after
        # the service health check. Discord-marked tests are excluded (no live token).
        run: uv run python -m pytest -m "integration and not discord"
