<!doctype html>
<!--
  Anchor autopost settings — one labelled/described row with a toggle switch per global
  autopost produce toggle. Served by dd.anchor.extensions.autopost_settings; the GET
  handler substitutes the __TOGGLES__ placeholder comment in <main> with the
  server-rendered rows (each reflecting the current AutoPostSettings row). A feed and its
  content sub-toggles share one .group box so they read as one category. Each switch is a
  CSS-styled checkbox, so Save still POSTs the checkbox state
  as JSON to /autopost_settings/save via shared.js's window.api(). Auth is the shared
  OAuth middleware (web_auth), same as every other page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Autopost Settings — Destiny Director</title>
    <link rel="stylesheet" href="/static/shared.css" />
    <!-- cv2_preview.css styles what cv2_render.js draws; the pair must be loaded
         together (asset_links.test.js enforces it). Both are here for the post
         preview shown inside this page's modals. -->
    <link rel="stylesheet" href="/static/cv2_preview.css" />
    <style>
      /* Base/reset/theme lives in shared.css (linked above); only this page's own
         styles are inlined here. Palette mirrors control_panel.html. */
      main.settings { margin: 1rem 0; }
      form#toggles { display: flex; flex-direction: column; gap: .6rem; }
      /* One box per category: a feed and its content sub-toggles share a .group. */
      .group {
        border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-3);
        overflow: hidden;
      }
      .group:hover { border-color: var(--border-hover); }
      .row {
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        padding: .7rem .9rem;
      }
      /* Sub-options live in the same box, set off by a divider, an indent and a dimmer
         background so they read as "part of this category, not a feed of their own". */
      /* Dim inner divider — deliberately fainter than --border to nest sub-rows. */
      .row + .row { border-top: 1px solid #30333a; }
      .row.sub { padding-left: 1.7rem; background: var(--surface-2); }
      .row.sub .name { font-size: .88rem; }
      .row .text { min-width: 0; }
      .row .name { font-size: .95rem; }
      /* Per-feed actions, inline on the row: one horizontal pair that wraps rather
         than squashing. Sits between the label and the toggle, so the switch stays
         where the eye expects it down the right edge. Explanations are hover cards —
         two labelled buttons do not need two paragraphs. */
      .rowactions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
      /* The row's text column holds the actions now, so it must be allowed to grow. */
      .row .text { flex: 1; }


      /* Modals. Native <dialog>, so Escape and the backdrop come free. */
      dialog.feedmodal {
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface-3); color: var(--text-1); padding: 1.1rem;
        max-width: 40rem; width: calc(100% - 2rem);
      }
      dialog.feedmodal::backdrop { background: rgba(0, 0, 0, .55); }
      dialog.feedmodal h2 { margin: 0 0 .5rem; font-size: 1.05rem; }
      dialog.feedmodal p.lede { margin: 0 0 .8rem; font-size: .92rem; color: var(--muted); }
      dialog.feedmodal label.publish {
        display: flex; align-items: center; gap: .45rem; font-size: .92rem;
        margin: .9rem 0 1rem;
      }
      .modal-actions { display: flex; justify-content: flex-end; gap: .6rem; }
      /* The rendered post inside a modal — bounded so a long post scrolls rather than
         pushing the confirm buttons off-screen. */
      .modalpreview { max-height: 50vh; overflow-y: auto; }
      .modalstatus { color: var(--text-faint); font-size: .85rem; }
      .modalstatus.err { color: var(--danger, #d9534f); }
      /* The send dialog carries two of these (preview build, send outcome) and usually
         only one is saying anything; an empty one must not hold open a gap. */
      .modalstatus:empty { display: none; }
      .row .desc { color: var(--text-faint); font-size: .8rem; margin-top: .15rem; }
      /* A URL setting stacks its full-width text input below the label instead of
         placing a switch on the right. */
      .row.urlrow { flex-direction: column; align-items: stretch; gap: .5rem; }
      .urlfield {
        width: 100%; box-sizing: border-box; padding: .45rem .6rem;
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface-1); color: var(--text-1); font-size: .9rem;
      }
      .urlfield:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
      }

      /* Toggle switch — a checkbox restyled as an iOS-style slider. The <input> stays a
         checkbox (visually hidden) so nothing about the save/read path changes. */
      .switch {
        position: relative; flex: none; width: 42px; height: 24px;
      }
      .switch input { position: absolute; opacity: 0; width: 100%; height: 100%;
        margin: 0; cursor: pointer; }
      .switch .slider {
        position: absolute; inset: 0; border-radius: 24px; background: var(--border);
        transition: background var(--dur) ease;
      }
      .switch .slider::before {
        content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px;
        border-radius: 50%; background: var(--text-1); transition: transform var(--dur) ease;
      }
      .switch input:checked + .slider { background: var(--accent); }
      /* Pure white knob on the pink fill (>=3:1 non-text contrast; #e6e6e6 would be 2.9). */
      .switch input:checked + .slider::before { transform: translateX(18px); background: #fff; }
      /* The checkbox is visually hidden and stretched over the switch, so it carries
         .no-focus-ring (see shared.css) and the slider wears the ring instead. */
      .switch input:focus-visible + .slider {
        outline: 2px solid var(--accent); outline-offset: 2px;
      }
      .actions {
        display: flex; align-items: center; gap: .8rem; margin-top: 1rem;
      }
      #status { color: var(--text-faint); font-size: .85rem; }
    </style>
  </head>
  <body>
    <header>
      <p class="nav"><a href="/" class="backlink">← Control panel</a></p>
      <h1>Autopost Settings</h1>
      <p class="muted">
        Toggle whether anchor produces each feed. These are global, bot-wide switches —
        they don't change which servers follow a feed. Changes take effect on the next
        scheduled post.
      </p>
    </header>
    <main class="settings">
      <form id="toggles">
        <!--__TOGGLES__-->
      </form>
      <div class="actions">
        <button type="button" class="primary" id="save">Save</button>
        <span id="status"></span>
      </div>
    </main>
    <dialog class="feedmodal" id="previewDialog">
      <h2 id="previewTitle">Preview</h2>
      <div class="modalpreview cv2-preview" id="previewBox"></div>
      <p class="modalstatus" id="previewStatus"></p>
      <div class="modal-actions">
        <button type="button" id="previewClose">Close</button>
      </div>
    </dialog>

    <dialog class="feedmodal" id="sendDialog">
      <h2 id="sendTitle">Send this post?</h2>
      <p class="lede" id="sendBody"></p>
      <!-- The post being sent, so the confirmation shows WHAT is going out, not just
           where. This is the preview; the row deliberately stays a list of toggles. -->
      <div class="modalpreview cv2-preview" id="sendPreview"></div>
      <!-- Two status lines, not one. The preview build and the send are deliberately
           independent — send stays available while the preview builds and even if it
           fails — so they must not share a slot: a preview resolving after a failed
           send used to clear the error, leaving a blank line and an armed button. Both
           can also be true at once ("Iron Banner is not running" AND "Send failed"),
           and both are worth reading. -->
      <p class="modalstatus" id="sendPreviewStatus"></p>
      <p class="modalstatus" id="sendStatus"></p>
      <label class="publish"
        ><input type="checkbox" id="publish" checked /> Publish (crosspost to
        followers)</label
      >
      <div class="modal-actions">
        <button type="button" id="sendCancel">Cancel</button>
        <button type="button" class="primary" id="sendConfirm">Send now</button>
      </div>
    </dialog>

    <!-- shared.js (deferred) defines window.api; defer preserves order, so it is
         ready before autopost_settings.js runs. cv2_model must precede cv2_render,
         which draws the post preview inside the modals above. -->
    <script src="/static/cv2_model.js" defer></script>
    <script src="/static/cv2_render.js" defer></script>
    <script src="/static/shared.js" defer></script>
    <script src="/static/autopost_settings.js" defer></script>
  </body>
</html>
