<!doctype html>
<!--
  /feeds — what each feed posts to, and whether it posts at all. Served by
  dd.anchor.extensions.autopost_settings; the GET handler substitutes the __TOGGLES__
  placeholder comment in <main> with three server-rendered <section>s, one per way a feed
  gets written (on a schedule, by you on a form, by somebody else).

  This and /settings were one page. They share a save endpoint, a channel-picker endpoint
  and settings_page.css; what they do not share is a reader — nobody arrives wanting to
  change an accent colour AND a feed's channel, and the eight colour/alert rows sat
  between the reader and every feed on the page.

  Auth is the shared OAuth middleware (web_auth), same as every other page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Feeds — Destiny Director</title>
    <link rel="stylesheet" href="/static/shared.css" />
    <link rel="stylesheet" href="/static/settings_page.css" />
    <!-- cv2_preview.css styles what cv2_render.js draws; the pair must be loaded
         together (asset_links.test.js enforces it). Both are here for the post
         preview shown inside this page's modals. -->
    <link rel="stylesheet" href="/static/cv2_preview.css" />
    <!-- Tom Select (vendored, window.TomSelect) backs the channel pickers below — same
         widget as weekly_reset_form.html. tom_select_dark.css must load after this
         vendored sheet (not before, e.g. alongside shared.css), or the vendored light
         theme cascades in after it and wins. -->
    <link rel="stylesheet" href="/static/vendor/tom-select.min.css" />
    <link rel="stylesheet" href="/static/tom_select_dark.css" />
  </head>
  <body>
    <header>
      <p class="nav"><a href="/" class="backlink">← Home</a></p>
      <h1>Feeds</h1>
      <p class="muted">
        What posts where. Switches stop the bot writing a feed — they don't change which
        servers follow it. Changes apply from the next post; no restart needed.
      </p>
    </header>
    <main class="settings">
      <form id="toggles">
        <!--__TOGGLES__-->
      </form>
      <div class="actions">
        <button type="button" class="primary" id="save">Save</button>
        <span id="status"></span>
      </div>
    </main>
    <dialog class="feedmodal" id="previewDialog">
      <h2 id="previewTitle">Preview</h2>
      <div class="modalpreview cv2-preview" id="previewBox"></div>
      <p class="modalstatus" id="previewStatus"></p>
      <div class="modal-actions">
        <button type="button" id="previewClose">Close</button>
      </div>
    </dialog>

    <dialog class="feedmodal" id="sendDialog">
      <h2 id="sendTitle">Send this post?</h2>
      <p class="lede" id="sendBody"></p>
      <!-- The post being sent, so the confirmation shows WHAT is going out, not just
           where. This is the preview; the row deliberately stays a list of toggles. -->
      <div class="modalpreview cv2-preview" id="sendPreview"></div>
      <!-- Two status lines, not one. The preview build and the send are deliberately
           independent — send stays available while the preview builds and even if it
           fails — so they must not share a slot: a preview resolving after a failed
           send used to clear the error, leaving a blank line and an armed button. Both
           can also be true at once ("Iron Banner is not running" AND "Send failed"),
           and both are worth reading. -->
      <p class="modalstatus" id="sendPreviewStatus"></p>
      <p class="modalstatus" id="sendStatus"></p>
      <label class="publish"
        ><input type="checkbox" id="publish" checked /> Also push to every server that
        follows this feed</label
      >
      <div class="modal-actions">
        <button type="button" id="sendCancel">Cancel</button>
        <button type="button" class="primary" id="sendConfirm">Send now</button>
      </div>
    </dialog>

    <!-- shared.js (deferred) defines window.api; defer preserves order, so it is
         ready before autopost_settings.js runs. cv2_model must precede cv2_render,
         which draws the post preview inside the modals above. Tom Select (vendored, no
         build step, same as weekly_reset_form.html) and ts_single.js (its
         tsWithCurrentOption, also shared with weekly_reset_form.js) must both precede
         autopost_settings.js, which turns each .channelfield <select> into a picker
         with them. -->
    <script src="/static/cv2_model.js" defer></script>
    <script src="/static/cv2_render.js" defer></script>
    <script src="/static/shared.js" defer></script>
    <script src="/static/vendor/tom-select.complete.min.js" defer></script>
    <script src="/static/ts_single.js" defer></script>
    <script src="/static/autopost_settings.js" defer></script>
  </body>
</html>
