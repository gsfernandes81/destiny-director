<!--
  The two dialogs behind every Preview / Send now pair — NOT a page. Spliced into the
  pages that carry those buttons (/feeds and /send) by feed_actions.py's `splice_modals`,
  at their __FEED_MODALS__ placeholder comment, and driven by feed_actions.js. (Written
  without its comment delimiters here on purpose: this file is spliced in AT that
  placeholder, so spelling it in full would put a live one back into the page.)

  A partial rather than markup in each shell, because the send confirmation is where the
  one irreversible click on the panel is armed: two copies would be two sets of words
  about what sending means, and they would drift the way every other duplicated surface
  here has. A partial rather than HTML built in Python for the ordinary reason — this is
  markup, and it reads as markup.

  A page including this must also load feed_actions.js, feed_actions.css, and the
  renderer pair (cv2_model.js + cv2_render.js + cv2_preview.css) that draws the post
  into the two preview boxes. asset_links.test.js holds those pairings.
-->
<dialog class="feedmodal" id="previewDialog">
  <h2 id="previewTitle">Preview</h2>
  <div class="modalpreview cv2-preview" id="previewBox"></div>
  <p class="modalstatus" id="previewStatus"></p>
  <div class="modal-actions">
    <button type="button" id="previewClose">Close</button>
  </div>
</dialog>

<dialog class="feedmodal" id="sendDialog">
  <h2 id="sendTitle">Send this post?</h2>
  <p class="lede" id="sendBody"></p>
  <!-- The post being sent, so the confirmation shows WHAT is going out, not just
       where. This is the preview; the row deliberately stays a list of toggles. -->
  <div class="modalpreview cv2-preview" id="sendPreview"></div>
  <!-- Two status lines, not one. The preview build and the send are deliberately
       independent — send stays available while the preview builds and even if it
       fails — so they must not share a slot: a preview resolving after a failed
       send used to clear the error, leaving a blank line and an armed button. Both
       can also be true at once ("Iron Banner is not running" AND "Send failed"),
       and both are worth reading. -->
  <p class="modalstatus" id="sendPreviewStatus"></p>
  <p class="modalstatus" id="sendStatus"></p>
  <label class="publish"
    ><input type="checkbox" id="publish" checked /> Also push to every server that
    follows this feed</label
  >
  <div class="modal-actions">
    <button type="button" id="sendCancel">Cancel</button>
    <!-- The one filled button in this flow, and it lives HERE rather than on either
         page: the send is a single irreversible click, so the page that leads to it
         stays quiet and the emphasis sits where the decision is actually made. -->
    <button type="button" class="primary" id="sendConfirm">Send now</button>
  </div>
</dialog>
