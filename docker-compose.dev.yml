# Remote Pi 5 dev environment. Bring up + log in to everything in one command:
#   make dev            (= make dev-up  +  make dev-login)
# then reach the container over the Pi host's sshd:
#   ssh -t <pi-user>@<pi-ip> 'docker exec -it dd-dev fish'
# or straight into its own sshd once DEV_SSH_BIND lets you (see `ports` below), and
# hold whatever you start there in an `abduco` session. Driving it from claude.ai/code
# is opt-in — DD_REMOTE_CONTROL, below.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Build the container's `dev` user with the HOST user's uid/gid so the
        # bind-mounted /workspace (below) stays writable. Pass via `make dev-up`
        # (HOST_UID=$(id -u) HOST_GID=$(id -g)); defaults to 1000 if unset.
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: dd-dev
    container_name: dd-dev
    hostname: ${DEV_HOSTNAME:-dd-dev}   # Claude Code shows this as the machine title;
                                        # make dev-up sets it to <host-hostname>-dd-dev
    init: true
    # Memory cap (cgroup v2 memory.max). Confines any OOM kill to THIS container's own
    # cgroup, so a runaway `make devbot-up` bot can never OOM-kill a neighbour (dd-postgres):
    # the kernel only reaps a process inside the offending cgroup. Applied on `make dev-up`;
    # override the sizes via .env (DEV_MEM_LIMIT / DEV_MEMSWAP_LIMIT). Default leaves ~1.4GB
    # of a 4GB Pi for dd-postgres + host while fitting dd-dev (~1.4GB idle) + both dev bots.
    mem_limit: ${DEV_MEM_LIMIT:-2560m}
    memswap_limit: ${DEV_MEMSWAP_LIMIT:-2816m}
    env_file: [.env]                          # DATABASE_URL + RAILWAY_API_TOKEN + app vars
    environment:
      # Claude Remote Control — the claude.ai/code and mobile-app daemon — is OFF unless
      # this is 1. The way in is a shell plus abduco; remote control is what you turn on
      # for a spell when you are away from a terminal, and a daemon running with nobody
      # driving it is a live claude nobody is watching, in a container holding this
      # repo's push keys and Railway token. Read by the entrypoint at start, so it lands
      # on `make dev-up`, not on a bare `docker restart`.
      DD_REMOTE_CONTROL: ${DD_REMOTE_CONTROL:-0}
    volumes:
      - .:/workspace                          # bind-mount the host clone; dev user uid built to match (USER_UID)
      - dd-uv-cache:/home/dev/.cache/uv        # persist uv cache (fast re-syncs)
      - dd-claude:/home/dev/.claude            # persist Claude Code login/config (incl. ~/.claude.json via CLAUDE_CONFIG_DIR)
      - dd-railway:/home/dev/.railway          # persist `railway login` (CLI writes ~/.railway/config.json, not ~/.config/railway)
      - dd-gh:/home/dev/.config/gh             # persist `gh auth login` (hosts.yml/config.yml under GH_CONFIG_DIR)
      - ${DEV_SSH_AUTHORIZED_KEYS}:/home/dev/.host-ssh:ro   # Pi host user's .ssh dir (from .env); sshd reads authorized_keys here
      - dd-ssh-host:/home/dev/.ssh-host        # persist sshd host key -> stable known_hosts
      - dd-zed-server:/home/dev/.zed_server    # persist Zed's remote server binary (no re-download per rebuild)
      - dd-local-share:/home/dev/.local/share  # persist fish history + bash history (HISTFILE points here)
    ports:
      # host ${DEV_SSH_PORT} (default 2222) -> the container's sshd.
      #
      # DEV_SSH_BIND is the ADDRESS it is published on, and it defaults to 127.0.0.1
      # because that default is the whole of this port's protection: sshd behind it is
      # key-only, but what a key gets you here is a shell in a container holding both
      # git push identities, a Railway token with prod in reach, and the bots' .env.
      # The Pi host's own sshd is already an authenticated hop in front of it, and a
      # cloudflared running on the Pi ITSELF reaches 127.0.0.1:${DEV_SSH_PORT} unchanged.
      #
      # So this default BREAKS `ssh -p 2222 dev@<pi-ip>` and Zed remoting straight in
      # from the LAN. Put DEV_SSH_BIND=0.0.0.0 in .env if that is how you connect — and
      # note publishing is create-time, so it lands on `make dev-up`, never a restart.
      - "${DEV_SSH_BIND:-127.0.0.1}:${DEV_SSH_PORT:-2222}:2222"
    depends_on:
      postgres:
        condition: service_healthy
    # Do NOT mount over /home/dev/venv or all of /home/dev — it would erase the
    # pre-built venv.
  postgres:
    image: postgres:17-alpine                 # arm64 image exists
    container_name: dd-postgres
    environment:
      POSTGRES_USER: kyber
      POSTGRES_PASSWORD: kyber
      POSTGRES_DB: kyber
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyber -d kyber"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dd-postgres-data:/var/lib/postgresql/data
volumes:
  dd-uv-cache:
  dd-claude:
  dd-railway:
  dd-gh:
  dd-ssh-host:
  dd-zed-server:
  dd-local-share:
  dd-postgres-data:
