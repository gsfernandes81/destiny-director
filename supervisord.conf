; PID 1 for the deployed container (see Dockerfile's CMD). It replaces the old
; docker-entrypoint.sh + deploy/pi-bplus/entrypoint.sh pair, and buys three things a
; shell `exec` could not:
;
;   * bounded restarts of the bot in-process, instead of an unbounded container
;     restart loop (on the Pi B+ that loop would re-run `alembic upgrade head` against
;     an SD card forever);
;   * a container that survives its bot — when the bot goes FATAL the container keeps
;     running, so the sshd below is still there to get a shell into it;
;   * a break-glass sshd alongside the bot at all.
;
; supervisord has NO dependency/ordering mechanism, and nothing here needs one: the
; migration that used to be sequenced ahead of the bot by `alembic upgrade head && ...`
; now runs inside the bot's own StartingEvent hook (dd/common/db_migrations.py).
;
; Everything runs as the non-root `dd` user because the image does `USER dd` — hence no
; `user=` keys (those require supervisord to start as root), and pidfile/socket/keys all
; live under paths dd owns. All logs go to the container's stdout/stderr: a log file
; inside a container is unreachable, `docker compose logs` / `podman logs` is not.

[supervisord]
nodaemon=true                        ; stay in the foreground — this process IS PID 1
silent=true                          ; ...but without ALSO echoing every record to stdout:
                                     ; nodaemon does that on its own, and with the logfile
                                     ; below already pointed at stdout it double-logs.
pidfile=/home/dd/run/supervisord.pid ; /var/run is root-owned; dd owns this
logfile=/dev/stdout
logfile_maxbytes=0                   ; a character device cannot be rotated; 0 = never
loglevel=info

; supervisorctl's transport. The point of this file is a container you can still get
; into when the bot is dead, and `supervisorctl restart bot` over ssh is the reason to
; bother. 0700 + a dd-owned directory is the whole access control (there is no other
; account in the image), so the "running without any HTTP authentication checking" CRIT
; line supervisord logs at every boot is expected, not a misconfiguration.
[unix_http_server]
file=/home/dd/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///home/dd/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; --- the bot ---------------------------------------------------------------------
;
; RAILWAY_SERVICE_NAME selects which bot this container is, replacing the entrypoint's
; if/elif. Railway injects it automatically (it is the service's name — `beacon` or
; `anchor`); the Pi sets it explicitly in /srv/dd/.env. The Railway-flavoured name is
; kept deliberately: supervisord's `%(ENV_X)s` has no default-value syntax, so a
; neutral name like BOT_NAME would still have to be set in *every* environment,
; including the one that already sets this for free — and a var that is unset at
; startup does not fail this program, it stops supervisord from starting at all.
;
; jemalloc: LD_PRELOAD and the shared MALLOC_CONF are baked into the image (Dockerfile),
; so they apply here with no per-program key. The one per-bot difference — anchor caps
; `narenas:2`, because jemalloc's default of 4*ncpu reserves per-arena metadata that
; bloated the small anchor process for no concurrency benefit, while beacon (the large,
; hot consumer the arena parallelism actually helps) keeps the default — cannot be
; expressed here: there is ONE program section for both bots, selected at runtime, and
; supervisord has no conditionals. Set MALLOC_CONF on the *anchor deployment* to
; override the image default:
;   MALLOC_CONF=narenas:2,background_thread:true,dirty_decay_ms:10000,muzzy_decay_ms:10000
; (see .env-example). Forgetting it costs a little RAM on anchor; nothing breaks.
[program:bot]
command=python -OO -m dd.%(ENV_RAILWAY_SERVICE_NAME)s
autostart=true
; `unexpected` = restart only on an exit code not in exitcodes. dd.common.lifecycle's
; contract is that a *clean* exit 0 (the /stop command) stays down; anything else is a
; crash and gets restarted. Note the consequence on Railway: /stop now leaves the
; container up with a stopped bot, where it used to end the deployment — supervisord
; outliving the bot is the point of this file, but it is still billable.
autorestart=unexpected
exitcodes=0
; The bot has to stay up 60s to count as "started" and reset the retry counter. It is
; deliberately longer than a startup: wait_for_db, then `alembic upgrade head`, then
; hikari's gateway handshake — on the Pi's 700MHz core that is a slow minute. A shorter
; window would let a bot that dies *during* startup look like a success and restart
; forever.
startsecs=60
; 3 consecutive failed starts, then FATAL: supervisord gives up on the bot, keeps
; running itself, and the container stays alive for ssh instead of crash-looping. The
; failure this bounds is the expensive one (a bad token, an unreachable database) where
; retrying cannot help; a transient failure gets three tries with backoff, and a bot
; that recovers past startsecs above starts the count again from zero.
startretries=3
; hikari installs SIGTERM handlers -> StoppingEvent -> the mirror-worker drain. Give
; that drain room to finish before supervisord escalates to SIGKILL.
stopsignal=TERM
stopwaitsecs=45
; Kill the whole process group, not just the interpreter: nothing here forks today, but
; a stray child holding the terminal open is exactly the hang stopwaitsecs cannot fix.
killasgroup=true
stopasgroup=true
redirect_stderr=true                 ; hikari logs to stderr; one ordered stream is easier
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=100

; --- break-glass sshd ------------------------------------------------------------
;
; Purpose: a shell in a container whose bot has died. It is DISARMED by default — sshd
; runs, but authorizes nobody unless SSH_AUTHORIZED_KEYS is set in the deployment's
; environment (.env on the Pi, a service variable on Railway). The one-line `sh -c`
; below copies that variable into the authorized_keys file sshd reads, so an unset
; variable means an empty file, which means every login is refused (password auth is
; off, so there is no other way in). The write is idempotent and re-runs on every
; restart.
;
; That `sh -c` is the ONE piece of shell in this image, and it is here rather than in a
; new .sh file on purpose. Three alternatives were tried or weighed and rejected:
;
;   * sshd's own AuthorizedKeysCommand pointed at /bin/printenv — the obvious no-shell
;     answer, and it does not work: OpenSSH runs that command with a scrubbed
;     environment (verified — the child sees only USER, LOGNAME, HOME, PATH, PWD,
;     SHLVL), so the variable is simply not there to read.
;   * referencing %(ENV_SSH_AUTHORIZED_KEYS)s anywhere in this file — that would make
;     the variable *mandatory in every environment*, because an unset name here stops
;     supervisord from starting at all. Taking prod down over an unset debug variable
;     is not a trade worth making.
;   * only starting sshd when a key is present — needs a conditional, which supervisord
;     does not have. Doing it in the `sh -c` (exit 0 when unset) works, but a program
;     that exits during its startsecs window goes BACKOFF -> FATAL, so the *default*,
;     healthy, disarmed deployment would log a retry storm on every boot. An idle sshd
;     costs ~2MB; that is the cheaper of the two.

; Host keys are generated at RUNTIME, never baked into the image: a baked host key would
; ship the same private key to every deployment. `-A` generates only the key types that
; are missing, so this is idempotent and re-runs for free; `-f` re-roots it out of
; /etc/ssh (unwritable to dd) into a directory that should be volume-backed, so the keys
; — and therefore the client's known_hosts entry — survive a container replacement.
; One-shot: autorestart=false + startsecs=0 means "ran, exited 0, done".
[program:sshd-keygen]
command=ssh-keygen -A -f /home/dd/.ssh-host
autostart=true
autorestart=false
startsecs=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=10

; sshd exits immediately if its host keys do not exist yet, so on a cold start it may
; lose the race with sshd-keygen above — supervisord's own retry loop is the fix, and
; the only "ordering" this file needs. Ten tries with supervisord's increasing backoff
; covers key generation even on the Pi's 700MHz core; after that it goes FATAL and stays
; out of the way (a container without ssh is a degraded container, not a broken one).
[program:sshd]
command=/bin/sh -c 'echo "$SSH_AUTHORIZED_KEYS" > /home/dd/.ssh/authorized_keys; exec /usr/sbin/sshd -D -e -f /etc/dd/sshd_config'
autostart=true
autorestart=true
startsecs=5
startretries=10
redirect_stderr=true                 ; -e sends sshd's log to stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20
