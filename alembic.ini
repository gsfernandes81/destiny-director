# Alembic configuration. The migration environment lives in `migrations/` (the same
# directory Atlas used before it), and the database URL is NOT set here: `env.py`
# takes it from `dd.common.cfg.db_url_async`, so migrations always target exactly the
# database the bots connect to. cfg validates the environment at import time, so run
# alembic through the Makefile targets (`make migration-plan/apply/dry-run/check`),
# which pass `uv run --env-file .env`.

[alembic]
# `%(here)s` is this file's directory, so both paths resolve the same however alembic
# is invoked (repo root, subdirectory, or /app in the prod image).
script_location = %(here)s/migrations
# Repo root on sys.path so `import dd.common...` works. path_separator is required as
# of alembic 1.16 (without it it warns and falls back to splitting paths on
# spaces/commas/colons).
prepend_sys_path = %(here)s
path_separator = os
# Timestamped filenames keep `migrations/versions/` in chronological order in a
# listing, as the Atlas migration directory was.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s
# Revision timestamps in UTC, matching everything else in this project.
timezone = UTC

# Newly generated revisions go through the same formatter as the rest of the repo
# (`make format`), so a fresh migration lands in house style — 88 columns, double
# quotes — instead of alembic's own output style.
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
