[[overrides]]
include = ["dd/common/schemas.py"]

# SQLAlchemy 2.0's Core/ORM query layer isn't fully modelled by ty, so these are
# suppressed file-wide. All six still fire (verified by flipping them to "error");
# fixing them would need per-line inline ignores across ~40 query sites.
[overrides.rules]
# `_UNSET` sentinel cast (None -> AsyncSession) and narrowing reassignments such as
# `result = result.fetchall()` that change a variable's type
invalid-assignment = "ignore"
# select()/where()/and_()/insert().values() and async_sessionmaker(**kwargs) args
invalid-argument-type = "ignore"
# returning session.execute().fetchall()/.scalar() as list[tuple]/Self
invalid-return-type = "ignore"
# .in_()/.fetchall() on Column/Result not seen on the inferred type
unresolved-attribute = "ignore"
# select() and column-operator overloads ty can't resolve
no-matching-overload = "ignore"
# ~column (SQL NOT) and datetime minus (None | timedelta) arithmetic
unsupported-operator = "ignore"

[[overrides]]
include = ["dd/hmessage/message.py"]

[overrides.rules]
# attrs `.validator` decorator not understood by ty
unresolved-attribute = "ignore"
# HMessage.attachments stores URLs (str) but field is typed list[Attachment] by design
invalid-argument-type = "ignore"

[[overrides]]
include = ["dd/sector_accounting/sector_accounting.py"]

[overrides.rules]
# attrs: attr.ib()-generated __init__ params trip ty's argument-type check (e.g. the
# _parse_counts converter accepts str|int but the field is typed int).
invalid-argument-type = "ignore"

[[overrides]]
include = ["dd/sector_accounting/utils.py"]

[overrides.rules]
# EntityRotation(list) narrows __getitem__ to int-only; slice variant not needed
invalid-method-override = "ignore"

[[overrides]]
include = [
    "dd/common/tests/test_utils.py",
    "dd/anchor/tests/test_cv2_nodes.py",
]

[overrides.rules]
# construct_emoji_substituter is typed for dict[str, h.Emoji] but only calls
# str() on the values, so the tests pass plain strings — and cv2_nodes.substitute_emoji,
# which is a thin wrapper over it, inherits both the signature and the stand-in.
invalid-argument-type = "ignore"

[[overrides]]
include = [
    "dd/hmessage/tests/test_message.py",
    "dd/beacon/tests/test_mirror_item_emoji.py",
]

[overrides.rules]
# HMessage.attachments stores URLs (str) but is typed list[Attachment] by design
# (mirrors the override on dd/hmessage/message.py). The mirror golden tests build the
# same URL-string attachments to pin the send payload.
invalid-argument-type = "ignore"

[[overrides]]
include = ["dd/sector_accounting/tests/test_sector_accounting.py"]

[overrides.rules]
# Rotation is built from plain dict literals for sector_rot/sector_data; ty wants
# defaultdict/SectorData but a dict suffices at runtime (mirrors the overrides on
# dd/sector_accounting/sector_accounting.py).
invalid-argument-type = "ignore"

[[overrides]]
include = [
    "dd/beacon/tests/test_feed_unavailable.py",
    "dd/beacon/tests/test_feed_channel_reconcile.py",
]

[overrides.rules]
# Driving a command callback or a StartedEvent listener without standing up a real
# lightbulb client means reaching past its DI wrappers: `Loader._loadables`, a
# loadable's `_callback`, and `SlashCommand.invoke._func` are all runtime-real but
# absent from the public types. The alternative — a live client and a dispatched
# gateway event — is far more machinery than "call the function" warrants.
unresolved-attribute = "ignore"
# A one-method stub stands in for `pages_cls` (it needs only `from_channel` and
# `teardown`), and CommandBase is what `make_navigator_command` actually returns.
invalid-argument-type = "ignore"
